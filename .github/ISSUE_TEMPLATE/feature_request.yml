name: Feature request
description: Something leakhound should detect, prevent, or explain
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The waste or blind spot
      description: What burns tokens (or hides information) that leakhound doesn't catch today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd want it to do
    validations:
      required: true
  - type: dropdown
    id: constraints
    attributes:
      label: Fits the ground rules?
      description: Everything here stays local, zero-dependency, and never edits your files. Audits stay scripts, not model calls.
      options:
        - Yes, fits within those
        - Not sure
        - Would need an exception (explain above)
    validations:
      required: true
