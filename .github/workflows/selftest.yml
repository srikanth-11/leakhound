name: selftests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - run: node scripts/waste.js --selftest
      - run: node scripts/mcp-audit.js --selftest
      - run: node scripts/model-audit.js --selftest
      - run: node scripts/plugin-audit.js --selftest
      - run: node scripts/trend.js --selftest
      - run: node scripts/statusline.js --selftest
      - run: node router/scripts/router-hook.js --selftest
      - run: node guard/scripts/guard-hook.js --selftest
